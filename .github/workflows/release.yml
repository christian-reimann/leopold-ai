name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.5.4). Leer lassen, um den Patch der letzten Version automatisch zu inkrementieren.'
        required: false

permissions:
  contents: write
  packages: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: resolve
        run: |
          set -e
          INPUT_VERSION="${{ github.event.inputs.version }}"
          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [ -z "$LAST_TAG" ]; then
            VERSION="1.0.0"
          else
            BASE="${LAST_TAG#v}"
            MAJOR=$(echo "$BASE" | cut -d. -f1)
            MINOR=$(echo "$BASE" | cut -d. -f2)
            PATCH=$(echo "$BASE" | cut -d. -f3)
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          echo "Version: $VERSION (letzter Tag: ${LAST_TAG:-keiner})"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: resolve-version
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push leopold image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/leopold:${{ needs.resolve-version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/leopold:latest
          cache-from: type=gha,scope=leopold
          cache-to: type=gha,mode=max,scope=leopold

  tag-release:
    runs-on: ubuntu-latest
    needs: [resolve-version, build]
    steps:
      - uses: actions/checkout@v6

      - name: GitHub Release erstellen
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -e
          gh release create "v${{ needs.resolve-version.outputs.version }}" \
            --title "v${{ needs.resolve-version.outputs.version }}" \
            --generate-notes \
            --target "${{ github.sha }}"
