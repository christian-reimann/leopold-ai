name: Deploy

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Resolve version from release tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check image version
        run: |
          docker manifest inspect ghcr.io/${{ github.repository_owner }}/leopold:${{ steps.version.outputs.value }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            docker-compose.yml
            Dockerfile.caddy
            Caddyfile
            docker/postgres-init

      - name: Write .env for server
        run: |
          cat > .env <<'EOF'
          IMAGE_TAG='${{ steps.version.outputs.value }}'
          APP_DOMAIN='${{ vars.APP_DOMAIN || 'localhost' }}'
          APP_PORT='${{ vars.APP_PORT || '3000' }}'
          REDIS_URL='${{ vars.REDIS_URL || 'redis://redis:6379' }}'
          OLLAMA_BASE_URL='${{ vars.OLLAMA_BASE_URL || 'http://ollama:11434' }}'
          POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD || 'leopold' }}'
          DATABASE_URL='postgres://leopold:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/leopold'
          ANTHROPIC_API_KEY='${{ secrets.ANTHROPIC_API_KEY }}'
          HETZNER_API_TOKEN='${{ secrets.HETZNER_API_TOKEN }}'
          EOF

      - name: Upload compose file + .env
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.SERVER_SSH_HOST }}
          username: ${{ vars.SERVER_SSH_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'docker-compose.yml, Dockerfile.caddy, Caddyfile, docker/postgres-init, .env'
          target: '~/apps/${{ github.repository }}'
          overwrite: true

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SERVER_SSH_HOST }}
          username: ${{ vars.SERVER_SSH_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GH_TOKEN
          script: |
            set -e
            cd ~/apps/${{ github.repository }}
            chmod 600 .env
            echo "$GH_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull web worker
            docker compose build caddy
            docker compose up -d postgres redis ollama
            docker compose exec -T ollama ollama pull bge-m3
            docker compose run --rm web node_modules/.bin/drizzle-kit migrate
            docker compose up -d --remove-orphans
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
