name: leopold

services:

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: leopold
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leopold}
      POSTGRES_DB: leopold
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U leopold']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - ollama-data:/root/.ollama

  pgweb:
    image: sosedoff/pgweb:latest
    restart: unless-stopped
    profiles: [dev]
    ports:
      - '127.0.0.1:8081:8081'
    environment:
      DATABASE_URL: postgres://leopold:${POSTGRES_PASSWORD:-leopold}@postgres:5432/leopold?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/christian-reimann/leopold:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: node_modules/.bin/next start
    env_file: .env
    environment:
      PORT: 3000
    volumes:
      - app-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: ghcr.io/christian-reimann/leopold:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: node dist/worker/runner.mjs
    env_file: .env
    volumes:
      - app-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    env_file: .env
    ports:
      - '${APP_PORT:-3000}:${APP_PORT:-3000}'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  postgres-data:
  redis-data:
  ollama-data:
  caddy-data:
  caddy-config:
  app-storage:

